 function cambiaColore() {

const immagini = [
  "https://www.chieselecce.it/wp-content/uploads/2022/06/duomo01.jpg",
  "https://upload.wikimedia.org/wikipedia/commons/8/85/Duomo_di_Lecce_Assunta.jpg",
  "https://cdn.visitlecce.eu/storage/2023/05/31/ca09d343b2bbf5c624a816106fa66b84d6dc76c7.jpg"
];

let index = 0;

function mostraSlide() {
  document.getElementById("slide").src = immagini[index];
}

function nextSlide() {
  index = (index + 1) % immagini.length;
  mostraSlide();
}

function prevSlide() {
  index = (index - 1 + immagini.length) % immagini.length;
  mostraSlide();
}

</script>
