<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Presentation</title>

    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        font-family: Arial, sans-serif;
        background: #111;
        color: white;
      }

      .slideshow {
        position: relative;
        width: 100%;
        height: 100%;
      }

      .slide {
        position: absolute;
        inset: 0;
        display: none;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        padding: 40px;
        box-sizing: border-box;
      }

      .slide.active {
        display: flex;
      }

      /* Click zones */
      .nav {
        position: fixed;
        top: 0;
        bottom: 0;
        width: 50%;
        z-index: 5;
      }

      .nav.left {
        left: 0;
      }
      .nav.right {
        right: 0;
      }

      /* Progress */
      .progress-bar {
        position: fixed;
        bottom: 0;
        left: 0;
        height: 4px;
        width: 100%;
        background: rgba(255, 255, 255, 0.2);
      }

      .progress {
        height: 100%;
        width: 0%;
        background: #00ffcc;
      }

      /* Slide number */
      .slide-number {
        position: fixed;
        bottom: 10px;
        right: 15px;
        font-size: 14px;
      }

      /* PRINT (FIXED) */
      @media print {
        html,
        body {
          overflow: visible;
          background: white;
          color: black;
        }

        .slideshow {
          position: static;
          height: auto;
        }

        .slide {
          position: relative;
          display: block !important;
          page-break-after: always;
          height: 100vh;
        }

        .nav,
        .progress-bar,
        .slide-number {
          display: none !important;
        }
      }
    </style>
  </head>

  <body>
    <div class="slideshow">
      <section class="slide" id="intro">
        <h1>Intro</h1>
        <p>Welcome</p>
      </section>

      <section class="slide" id="topic">
        <h1>Topic</h1>
        <p>Content here</p>
      </section>

      <section class="slide" id="end">
        <h1>End</h1>
        <p>Thanks</p>
      </section>
    </div>

    <div class="nav left"></div>
    <div class="nav right"></div>

    <div class="progress-bar"><div class="progress"></div></div>
    <div class="slide-number"></div>

    <script>
      const slides = Array.from(document.querySelectorAll(".slide"));
      let current = 0;

      /* ---------- CORE ---------- */

      function showSlide(index, push = true) {
        if (index < 0 || index >= slides.length) return;

        slides.forEach((s) => s.classList.remove("active"));
        slides[index].classList.add("active");

        current = index;

        if (push) {
          history.replaceState(null, "", "#" + slides[index].id);
        }

        updateUI();
      }

      function next() {
        if (current < slides.length - 1) showSlide(current + 1);
      }

      function prev() {
        if (current > 0) showSlide(current - 1);
      }

      /* ---------- UI ---------- */

      function updateUI() {
        // progress
        const percent = ((current + 1) / slides.length) * 100;
        document.querySelector(".progress").style.width = percent + "%";

        // numbers
        document.querySelector(".slide-number").textContent =
          current + 1 + " / " + slides.length;
      }

      /* ---------- INIT ---------- */

      function init() {
        let index = slides.findIndex((s) => s.id === location.hash.slice(1));
        if (index === -1) index = 0;

        showSlide(index, false);
      }

      /* ---------- EVENTS ---------- */

      // keyboard
      document.addEventListener("keydown", (e) => {
        if (e.key === "ArrowRight") next();
        if (e.key === "ArrowLeft") prev();
      });

      // click navigation
      document.querySelector(".nav.left").onclick = prev;
      document.querySelector(".nav.right").onclick = next;

      // touch
      let startX = 0;

      document.addEventListener("touchstart", (e) => {
        startX = e.touches[0].clientX;
      });

      document.addEventListener("touchend", (e) => {
        const diff = startX - e.changedTouches[0].clientX;
        if (diff > 50) next();
        if (diff < -50) prev();
      });

      // hash change
      window.addEventListener("hashchange", init);

      // start
      init();
    </script>
  </body>
</html>
